name: Render Backend Keep Alive

on:
  schedule:
    # Ping every 14 minutes to reduce Render free-tier cold starts
    - cron: "*/14 * * * *"
  workflow_dispatch:

jobs:
  ping-render-health:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Validate healthcheck URL secret
        env:
          HEALTHCHECK_URL: ${{ secrets.RENDER_HEALTHCHECK_URL }}
        run: |
          if [ -z "$HEALTHCHECK_URL" ]; then
            echo "RENDER_HEALTHCHECK_URL secret is missing."
            exit 1
          fi

      - name: Ping Render health endpoint
        env:
          HEALTHCHECK_URL: ${{ secrets.RENDER_HEALTHCHECK_URL }}
        run: |
          echo "Pinging $HEALTHCHECK_URL"
          curl --fail --show-error --silent --location \
            --connect-timeout 10 \
            --max-time 30 \
            --retry 3 \
            --retry-delay 5 \
            "$HEALTHCHECK_URL"
          echo "Render backend ping successful."
