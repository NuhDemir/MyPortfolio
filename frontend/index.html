<!DOCTYPE html>
<html lang="tr">

<head>
  <!-- Temel Karakter Seti ve Görüntü Alanı Ayarları -->
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <!-- SEO ve Tarayıcı Görünümü için Meta Etiketleri -->
  <title>Nuh Demir | Web Geliştirici & Tasarımcı</title>
  <meta name="description"
    content="Nuh Demir'in kişisel portfolyo sitesi. Modern web teknolojileri ile geliştirilen projelerimi ve hizmetlerimi keşfedin." />
  <meta name="theme-color" content="#111111" />

  <script>
    (function(){var t=localStorage.getItem("theme")||"dark";if(t==="dark")document.documentElement.classList.add("ds-dark")})();
  </script>

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="/logo/logo-portfolio.png" />

  <!-- ==================================================================== -->

  <!-- ==================================================================== -->

  <!-- 1. En Önemli Fontları Önceden Yükle (LCP elemanları için) -->
  <!-- Not: 'href' yollarının `public/fonts/` klasörünüzdekiyle aynı olduğundan emin olun. -->
  <link rel="preload" href="/fonts/space-grotesk-v21-latin_latin-ext-700.woff2" as="font" type="font/woff2"
    crossorigin />
  <link rel="preload" href="/fonts/space-grotesk-v21-latin_latin-ext-regular.woff2" as="font" type="font/woff2"
    crossorigin />

  <!-- Figtree (Google Fonts) — primary display typeface -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link rel="preload" as="style" href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;600;700;800&display=swap" />
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;600;700;800&display=swap" media="print" onload="this.media='all'" />
  <noscript>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;600;700;800&display=swap" />
  </noscript>
